<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>木子的骰寶桌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面照 mock/layout.html v6：對話框、正方形場景、「她的籌碼｜骰子｜你的籌碼」一列、操作區。 */
:root {
  --felt: #0e3527; --felt-lo: #0a281d; --brass: #c8a14a; --brass-dim: #8a7034; --ink: #f2ecdc; --muted: #a7b9a9;
  --red: #d64a3b; --win: #7fd18b; --clue: #8fc3d6; --ivory: #f6f1e4; --shadow: rgba(0,0,0,.45);
  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif; --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--felt-lo); color: var(--ink); font: 15px/1.5 var(--body); }
/* 滿版：整頁撐滿高度，對話框吸收剩餘空間；寬螢幕才置中限寬 */
.wrap { min-height: 100dvh; padding-block: calc(10px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)); padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; }
.lower { position: relative; flex: 1; display: flex; flex-direction: column; gap: 10px; }  /* 骰子列、對話框、操作區；換骰框蓋住整塊 */
.lower > .talk { flex: 1; height: auto; min-height: 84px; margin-top: 12px; }  /* 上方留書籤的位置 */  /* 對話框吃掉剩下的高度；操作區固定高，所以各階段都不變 */
@media (min-width: 521px) { .wrap { max-width: 480px; margin: 0 auto; } }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.talk { position: relative; border-left: 3px solid var(--brass); background: rgba(0,0,0,.25); border-radius: 0 8px 8px 0; padding: 8px 12px; height: 100px; flex: none; display: flex; flex-direction: column; }  /* 固定高度，各階段不變 */
/* 名字做成書籤：貼在框的左上緣、往上凸出，不佔框內空間，字再多也蓋不到 */
.talk .who { position: absolute; left: -3px; bottom: 100%; padding: 1px 10px 0; background: var(--brass); color: var(--felt-lo); font-size: .72rem; font-weight: 700; letter-spacing: .15em; line-height: 1.5; border-radius: 6px 6px 0 0; }
/* 字太多時從上面切掉最舊的那行 */
.talk .lines { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
.talk p { margin: 0; }
.talk .tell { color: var(--clue); font-size: .92rem; }
.talk .act { color: var(--muted); font-size: .92rem; }
.talk .mind { color: #e8c98a; font-size: .95rem; font-style: italic; }  /* 主角的心聲 */
.talk .say { color: var(--ink); font: 700 1rem/1.5 var(--display); }  /* 說出口的話（「」開頭）：白色粗明體；沒有「」的敘述改灰綠，跟話分開 */

.scene { position: relative; width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #000; }
.scene canvas { width: 100%; height: 100%; display: block; }
.tag { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.5); color: var(--muted); font-size: .7rem; padding: 2px 8px; border-radius: 999px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); background: var(--felt-lo); }

.row { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; align-items: stretch; }  /* 她的籌碼｜場景｜你的籌碼 */
.purse { border: 1.5px solid var(--brass-dim); border-radius: 10px; background: rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; padding: 6px 4px; overflow: hidden; }
.purse .who { font-size: .7rem; color: var(--brass); letter-spacing: .1em; margin-bottom: auto; }
.purse canvas { width: 40px; height: auto; display: block; }
.purse .n { font: 700 .9rem var(--body); font-variant-numeric: tabular-nums; }
.overlay.record .sheet { gap: 14px; padding: 18px 16px 16px; }
.overlay.record .head { text-align: center; color: var(--brass-dim); font-size: .78rem; letter-spacing: .25em; }
.overlay.record .badge-title { font: 900 1.9rem/1.25 var(--display); color: var(--brass); text-align: center; letter-spacing: .1em; margin: -6px 0 0; text-wrap: balance; }
.overlay.record.fail .badge-title { color: var(--red); font-size: 1.6rem; }
.overlay.record.fail .sheet { border-color: var(--red); }
.overlay.record .why { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: -4px; }
.overlay.record .why span { font-size: .8rem; color: var(--ink); border: 1px solid var(--brass-dim); border-radius: 999px; padding: 1px 10px; }
.overlay.record .nums { display: grid; grid-template-columns: 1fr 1fr 1fr 1.4fr; background: rgba(0,0,0,.25); border-radius: 10px; padding: 10px 4px; }
.overlay.record .nums div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.overlay.record .nums div + div { border-left: 1px solid rgba(200,161,74,.2); }
.overlay.record .nums b { font: 900 1.35rem/1.1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.overlay.record .nums span { font-size: .72rem; color: var(--muted); }
.overlay.record .sec { display: flex; align-items: center; gap: 8px; color: var(--brass); font-size: .78rem; letter-spacing: .2em; margin-bottom: -4px; }
.overlay.record .sec::after { content: ""; flex: 1; height: 1px; background: var(--brass-dim); opacity: .5; }
.overlay.record ol.path { list-style: none; margin: 0; padding: 0 0 0 4px; }
.overlay.record ol.path li { position: relative; padding: 0 0 12px 20px; display: flex; flex-direction: column; }
.overlay.record ol.path li:last-child { padding-bottom: 0; }
.overlay.record ol.path li::before { content: ""; position: absolute; left: 0; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--felt-lo); box-shadow: 0 0 0 2px var(--brass-dim); }
.overlay.record ol.path li:not(:last-child)::after { content: ""; position: absolute; left: 4px; top: 16px; bottom: 0; width: 1px; background: var(--brass-dim); }
.overlay.record ol.path li.last::before { background: var(--brass); box-shadow: 0 0 0 2px var(--brass); }
.overlay.record.fail ol.path li.last::before { background: var(--red); box-shadow: 0 0 0 2px var(--red); }
.overlay.record ol.path small { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.overlay.record ol.path li.last span { color: var(--brass); font-weight: 700; }
.overlay.record.fail ol.path li.last span { color: var(--red); }
.overlay.record .miss { display: flex; flex-direction: column; gap: 4px; }
.overlay.record .miss .big { font-weight: 700; }
.overlay.record .miss .row { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); padding-left: 12px; }
.overlay.record .miss .row b { color: var(--ink); font-variant-numeric: tabular-nums; }
.overlay.record .miss .act { font-size: .85rem; margin-top: 2px; }
.overlay.record .foot { border-top: 1px solid rgba(200,161,74,.25); padding-top: 10px; text-align: center; font-size: .75rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.purse .wallet { font-size: .62rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.dice { display: flex; gap: 10px; justify-content: center; align-items: center; padding-bottom: 14px; }  /* 底部留「偷看的」「被出千」標籤的位置 */
.die { width: 54px; height: 54px; border-radius: 11px; background: var(--felt-lo); box-shadow: inset 0 0 0 2px var(--brass-dim); position: relative; }
.die img { width: 100%; height: 100%; display: block; object-fit: contain; }
.die.shown { background: none; box-shadow: none; }
.die.heard { background: none; box-shadow: 0 0 0 2px var(--clue); }
.die.heard img { filter: sepia(1) hue-rotate(150deg) saturate(1.6) brightness(1.05); }
.die.heard::after { content: "偷看的"; position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: .7rem; color: var(--clue); white-space: nowrap; }
.die.cheatmark::after { content: "被出千"; position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: .7rem; font-weight: 700; color: var(--red); white-space: nowrap; }
.die.shake { animation: shake .14s infinite alternate; }
.die.flipanim img { animation: flip .28s ease-out; }
.die.flipped::after { content: "你撥的"; position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: .7rem; color: var(--clue); white-space: nowrap; }
@keyframes flip { 0% { transform: scaleX(1); } 45% { transform: scaleX(.1) translateY(-4px); } 100% { transform: scaleX(1); } }
@keyframes shake { from { transform: translate(-2px, 1px) rotate(-6deg); } to { transform: translate(2px, -1px) rotate(6deg); } }

.panel { border: 2px solid var(--brass); border-radius: 14px; padding: 8px 10px; background: rgba(0,0,0,.15); display: flex; flex-direction: column; justify-content: center; gap: 6px; height: 144px; flex: none; }  /* 固定高度，各階段不變；下注那頁剛好塞滿 */
.label { font-size: .72rem; color: var(--muted); letter-spacing: .1em; }
.amt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.amt button { border: 1.5px solid var(--brass-dim); background: transparent; border-radius: 10px; padding: 6px; font-variant-numeric: tabular-nums; }
.amt button.on { background: var(--brass); color: var(--felt-lo); border-color: var(--brass); font-weight: 700; }
.amt button:disabled { opacity: .3; cursor: default; }
.bs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bs button { border: 2px solid var(--brass); background: rgba(0,0,0,.2); border-radius: 12px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; }
.bs b { font: 900 2.1rem/1.1 var(--display); }
.bs small { color: var(--muted); font-size: .72rem; }
.bs button:disabled { opacity: .3; cursor: default; }
.moves { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.mv { border: 1.5px solid var(--brass-dim); background: rgba(0,0,0,.25); border-radius: 10px; padding: 20px 6px; display: flex; flex-direction: column; align-items: center; }
.mv b { font: 900 1.05rem/1.25 var(--display); letter-spacing: .02em; white-space: nowrap; }
.mv.open { background: var(--brass); color: var(--felt-lo); border-color: var(--brass); } .mv.open small { color: var(--felt-lo); opacity: .75; }
.moves.two { grid-template-columns: repeat(2, minmax(0,1fr)); } .moves.one { grid-template-columns: 1fr; }
.mv.grab { border-color: var(--red); } .mv.swap { border-color: var(--clue); }
.mv:disabled { opacity: .35; cursor: default; }
/* 每把結束的彈出視窗 */
.pop { position: fixed; left: 50%; top: 50%; z-index: 30; transform: translate(-50%, -50%); min-width: 200px; text-align: center; background: rgba(6, 22, 16, .94); border: 2px solid var(--brass); border-radius: 16px; padding: 16px 28px; box-shadow: 0 10px 40px rgba(0,0,0,.6); pointer-events: none; display: flex; flex-direction: column; gap: 4px; animation: popio 2s ease-out forwards; }
.pop b { font: 900 2.2rem/1.15 var(--display); color: var(--ink); letter-spacing: .08em; white-space: nowrap; }
.pop span { font: 900 1.5rem/1.2 var(--display); white-space: nowrap; }
.pop.win { border-color: var(--win); } .pop.win span { color: var(--win); }
.pop.lose { border-color: var(--red); } .pop.lose span { color: var(--red); }
@keyframes popio { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); } 20% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(.97); } }
@media (prefers-reduced-motion: reduce) { .pop { animation: popfade 2s linear forwards; } @keyframes popfade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } } }
/* 字卡（B 版：第一層進第二層時，主角心聲跳一張卡，點一下關掉） */
.titlecard { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(4, 14, 10, .82); padding: max(12px, env(safe-area-inset-top, 0px)) 14px max(12px, env(safe-area-inset-bottom, 0px)); animation: tcin .4s ease-out; cursor: pointer; }
.titlecard > div { width: 100%; max-width: 420px; border: 2px solid #e8c98a; border-radius: 14px; background: rgba(6, 22, 16, .96); padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
/* 2026-11-09 三種聲音分開：心聲（括號）＝暖金色細字；旁白／提示＝灰綠小字；說出口的話＝白色粗明體，前面標誰說的 */
.titlecard p { margin: 0; color: #e8c98a; font: italic 400 1rem/1.65 var(--body); }  /* 心聲：斜體（2026-11-09 使用者定） */
.titlecard small { color: var(--muted); text-align: center; font-size: .75rem; }
.titlecard > div { position: relative; }
.titlecard .tcstep { position: absolute; top: 10px; right: 14px; font: 400 .78rem/1 var(--body); font-style: normal; color: var(--muted); opacity: .55; letter-spacing: .08em; pointer-events: none; }  /* 換層進度（2026-11-09 使用者定）：淡淡的 1/3、2/3、3/3 */
.titlecard.storycard .tcstep { top: max(12px, env(safe-area-inset-top, 0px)); right: 16px; z-index: 1; }
.titlecard .tcres { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 12px; border-bottom: 1px solid var(--brass-dim); }  /* 換層那把的結算，放在字卡最上面 */
.titlecard .tcres b { font: 900 1.9rem/1.15 var(--display); color: var(--ink); letter-spacing: .08em; }
.titlecard .tcres span { font: 900 1.3rem/1.2 var(--display); }
.titlecard .tcres.win span { color: var(--win); } .titlecard .tcres.lose span { color: var(--red); }
.titlecard p.act { color: var(--muted); font: 400 .9rem/1.65 var(--body); }
.titlecard p.line, .titlecard p.you { color: var(--ink); font: 700 1.12rem/1.55 var(--display); }
.titlecard .spk { display: inline-block; vertical-align: .15em; margin-right: 8px; padding: 0 7px; border-radius: 5px; background: var(--brass); color: var(--felt-lo); font: 700 .68rem/1.6 var(--body); letter-spacing: .12em; }
.titlecard p.you .spk { background: var(--clue); }
.titlecard .choices { display: grid; gap: 8px; margin-top: 2px; position: sticky; bottom: -12px; padding: 6px 0 12px; margin-bottom: -12px; background: rgba(6, 22, 16, .98); }  /* 選項黏在卡片底部，內容再長也看得到兩個按鈕 */
.titlecard .choices button { border: 2px solid var(--brass); background: rgba(0,0,0,.25); color: var(--ink); border-radius: 12px; padding: 10px; font: 900 1.02rem/1.3 var(--display); letter-spacing: .05em; }
.titlecard.choose { cursor: default; }
.titlecard.chain { animation: none; }            /* 接續的字卡：背景不再淡入，免得兩張之間露出遊戲畫面閃一下 */
.titlecard.chain > div { animation: tcin .3s ease-out; }
.titlecard > div { max-height: calc(100dvh - 24px); overflow-y: auto; }
.titlecard img.tcimg { width: 100%; max-height: 30dvh; object-fit: cover; border-radius: 8px; display: block; flex: none; }
@keyframes tcin { from { opacity: 0; } to { opacity: 1; } }
/* 結局劇情卡：滿版，圖吃掉上面剩下的高度，文字區固定高度一句一句換 */
.titlecard.storycard { padding: 0; place-items: stretch center; }
.titlecard.storycard > div.story { width: 100%; max-width: 480px; height: 100dvh; max-height: none; overflow: hidden; border: 0; border-radius: 0; box-shadow: none; background: rgba(6, 22, 16, .98); padding: max(12px, env(safe-area-inset-top, 0px)) 16px max(14px, env(safe-area-inset-bottom, 0px)); gap: 14px; justify-content: center; }  /* 圖、字、按鈕整組置中，字貼著圖 */
.story img.tcimg { flex: none; width: 100%; height: auto; max-height: 58dvh; object-fit: cover; border-radius: 10px; }  /* 圖照原比例放滿寬，不裁掉兩邊 */
.story-text { flex: none; min-height: 6.6em; display: flex; align-items: center; }
.story-text p { animation: linein .35s ease-out; font-size: 1.08rem; }
.story-text p.act { font-size: 1rem; }
.story-text p.line, .story-text p.you { font-size: 1.2rem; }
@keyframes linein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.story-tail { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 40px; justify-content: flex-end; }
.story-tail .choices { position: static; width: 100%; margin: 0; padding: 0; background: none; animation: linein .35s ease-out; }
.story-tail .dots { display: flex; gap: 6px; }
.story-tail .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--brass-dim); opacity: .5; }
.story-tail .dots i.on { background: #e8c98a; opacity: 1; }
/* 抉擇階段的外框閃爍 */
.scene.watch { animation: watchblink 1.2s ease-in-out infinite; }
@keyframes watchblink { 0%, 100% { box-shadow: 0 0 0 3px var(--clue), 0 0 16px rgba(143,195,214,.55); } 50% { box-shadow: 0 0 0 3px rgba(143,195,214,0), 0 0 0 rgba(143,195,214,0); } }
@media (prefers-reduced-motion: reduce) { .scene.watch { animation: none; box-shadow: 0 0 0 3px var(--clue); } }
/* 說明投影片 */
.hl { box-shadow: 0 0 0 2px var(--clue), 0 0 12px rgba(143,195,214,.45); animation: hlpulse 1.1s ease-in-out infinite alternate; }  /* 底色先亮著，動畫停時也看得到 */
@keyframes hlpulse { from { box-shadow: 0 0 0 2px rgba(143,195,214,.45), 0 0 4px rgba(143,195,214,.2); } to { box-shadow: 0 0 0 2px var(--clue), 0 0 18px rgba(143,195,214,.6); } }
.panel.demo button { pointer-events: none; }
.slide { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.slide b { font: 900 1.45rem/1.2 var(--display); color: var(--brass); letter-spacing: .15em; }
.slide small { font-size: .95rem; color: var(--ink); line-height: 1.45; }
.dice .badge { font: 700 .92rem var(--body); color: var(--ink); background: rgba(0,0,0,.35); border: 1px solid var(--brass-dim); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.label.legend { text-align: center; display: block; border-radius: 6px; padding: 2px 0; }
.talk .tabs { position: absolute; right: 0; bottom: 100%; display: flex; gap: 6px; align-items: flex-end; }
.talk .tabs .nexttab { position: static; }
.titlecard .hintbtn { align-self: center; background: transparent; color: var(--clue); border: 1px dashed var(--clue); border-radius: 999px; padding: 4px 22px; font: 700 .85rem/1.5 var(--body); letter-spacing: .2em; }
.titlecard .hintbox { display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--clue); padding-top: 10px; animation: tcin .4s ease-out; }
.titlecard .hintbox p { color: var(--clue); }
/* 2026-11-09 跳過說明從「下一步」旁邊移到最下面一排正中間（有聲、清零重來中間），跟下一步分開免得誤按 */
.skiptab { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom, 0px)); z-index: 20; font-size: .72rem; color: var(--brass); background: rgba(0,0,0,.55); border: 1px solid var(--brass-dim); border-radius: 999px; padding: 4px 14px; letter-spacing: .05em; }
.nexttab { position: absolute; right: 0; bottom: 100%; padding: 2px 10px 1px; background: var(--clue); color: var(--felt-lo); border: 0; border-radius: 6px 6px 0 0; font: 700 .72rem/1.5 var(--body); letter-spacing: .05em; }
@media (prefers-reduced-motion: reduce) { .hl { animation: none; box-shadow: 0 0 0 2px var(--clue); } }
.swapbox { position: absolute; inset: 0; z-index: 5; background: var(--felt-lo); border: 2px solid var(--clue); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.swapbox .title { font: 900 1.2rem var(--display); color: var(--clue); letter-spacing: .2em; text-align: center; margin: 0; }
.swapbox .watch { text-align: center; font-size: 1rem; }
.bar { position: relative; height: 44px; border-radius: 8px; overflow: hidden; background: #000; }
.z { position: absolute; top: 0; bottom: 0; } .z.ok { background: var(--win); } .z.fail { background: #c9a227; } .z.caught { background: var(--red); }
.marker { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: var(--ivory); box-shadow: 0 0 6px #fff; }
.marker.frozen { background: #fff; width: 6px; margin-left: -3px; box-shadow: 0 0 10px #fff; }
.watch { margin: 0; color: var(--muted); font-size: .9rem; }
.zone { margin: 0; text-align: center; font: 900 1.4rem var(--display); padding: 6px; }

    const again = () => { G = fresh(); newRound(); };

      : G.over === "lose" ? `你桌上的 ${G.lost} 個籌碼，全被她收走了。身上還剩 ${wallet} 個。`
      : `桌上的籌碼輸光了。身上還剩 ${wallet} 個。`;
    const broke = G.over !== "win" && wallet < FEE + 1;
    if (G.over !== "win") {
      const hint = lostGames >= LOSE_HINT_AT ? [{ c: "hint", t: LOSE_HINT[layer] }] : [];
      if (broke) { showTitleCard([{ c: "act", t: money }, ...END_HINT[layer], ...hint], () => showRecord(true), "點一下看紀錄"); return; }
      showTitleCard([{ c: "act", t: money }, ...END_HINT[layer], ...hint], again, "點一下再賭一局"); return;
    }
    if (G.winBy === "clear") {  // 贏光她桌上的：沒抓到她，所以不揭露、不進破關結尾
      showTitleCard([{ c: "act", t: "她桌上的籌碼一個都不剩。她把空盅推給你。" }, { c: "line", t: "「……明天再來。」" }, { c: "act", t: money }], again, "點一下再賭一局"); return;
    }
    // 啤酒罐上的閃燈按鈕：說明和提示都不講，破關這裡才揭露（2026-11-09 使用者定）
    showChoiceCard([  // 2026-11-09 使用者要多一點敘述：心聲之間補旁白（按住她、翻罐子、撕鋁箔、她的反應）
      { c: "act", t: "燈閃的那一下，你按住她扶著骰盅的右手。她想抽回去，你沒放。" },
      "（抓到了。盅底下那顆骰子還卡在她指尖，翻到一半。）",
      { c: "act", t: "你用另一隻手拿起她那罐台啤，翻過來。罐底貼了一層鋁箔紙。" },
      { c: "act", t: "你用指甲把鋁箔紙撕開，底下夾著一顆小小的無線按鈕。" },
      { c: "act", t: "木子沒說話，眼睛盯著那顆按鈕。" },
      "（她舉罐喝酒時，拇指偷按一下，天花板那根燈管就閃。有時候是真的要動手，有時候只是在騙我。）",
      { c: "act", t: "接下來，你要怎麼做？" }], [
      { label: "讓她賠錢了事", fn: () => ending("pay") },
      { label: "把她的手法公諸於世", fn: () => ending("expose") },
    ], "end-reveal");  // 3/3 移到前一張「抓到了」卡（2026-11-09）
    function ending(k) {
      const e = ENDINGS[k]; S.hold = e.hold; G.ending = k;
      // 破關後最後一張卡：只放「從頭開始」（清掉三層進度，回到說明第一頁）（2026-11-09 使用者定）
      RUN.ending = k; RUN.done = Date.now(); saveRun();
      const last = (x) => showTitleCard(x.lines, showRecord, "點一下看破關紀錄", x.pic, true);  // 最後一張結局卡之後是破關紀錄
      if (e.next) showTitleCard(e.lines, () => last(e.next), "點一下繼續", e.pic, true);
      else last(e);
    }
  }
  function renderEnd() {
    const won = G.over === "win"; const s = G.stats;
    const head = won ? "你抓到她了" : G.over === "lose" ? "你被趕出去了" : "你的籌碼沒了";
    const sub = won ? "她把手抽回去，盯著你看了很久：「明天再來。」" : G.over === "lose" ? "她把籌碼收進抽屜：「慢走。」" : "她把籌碼收進抽屜：「慢走。」";
    return el("div", { class: "sheet" },
      el("h2", {}, head),
      el("p", {}, sub),
      won ? null : G.hintShown ? el("p", { class: "tell" }, HINTS[layer]) : el("button", { class: "hint", onclick: () => { G.hintShown = true; render(); } }, "提示"),
      el("div", { class: "stats" },
        el("span", {}, "總共開了"), el("b", {}, `${G.round} 把`),
        el("span", {}, "她出千"), el("b", {}, `${s.cheats} 次`),
        el("span", {}, "慢了一步"), el("b", {}, `${s.half} 次`),
        ),
      el("button", { class: "next", onclick: () => { G = fresh(); newRound(); } }, "再賭一局"),
      el("button", { class: "hint", onclick: () => startIntro(true) }, "從說明開始"),
      el("details", { class: "logbox", open: true },
        el("summary", {}, "每把紀錄"),
        renderLog()));
  }

  // ---------- 啟動 ----------
  function showRecord(fail) {  // fail：破產紀錄（2026-11-09 使用者定，失敗也給）
    // 2026-11-09 第二版：玩家看得懂的白話（稱號＋怎麼來的、這一路的時間軸、失手），拿掉表格和內部用語
    const r = RUN, k = r.kicked;
    if (fail && !r.done) { r.done = Date.now(); saveRun(); }
    const min = Math.max(1, Math.round(r.ms / 60000));
    const d = new Date(r.done || Date.now()); const pad = (n) => String(n).padStart(2, "0");
    const sumK = (key) => k[1][key] + k[2][key] + k[3][key];
    const wrong = sumK("wrong"), early = sumK("early"), late = sumK("late"), kickedTotal = wrong + early + late;
    // 稱號：破關＝剩下的錢＋結局＋破關把數；破產＝撐了幾把
    const money = wallet >= 65 ? "闊氣" : wallet >= 50 ? "穩當" : wallet >= 30 ? "手頭緊" : "窮酸";
    const kind = r.ending === "expose" ? "無情" : "寬容";
    const noun = r.rounds <= 12 ? "賭神" : r.rounds <= 25 ? "賭俠" : r.rounds <= 30 ? "賭徒" : "賭狗";
    const title = fail ? (r.rounds <= 10 ? "一下就輸光的冤大頭" : r.rounds <= 20 ? "不服輸的賭客" : r.rounds <= 35 ? "死纏爛打的賭棍" : "輸不完的老賭狗")
      : `${money}又${kind}的${noun}`;
    const why = fail ? [`撐了 ${r.rounds} 把`] : [`剩 ${wallet} 個籌碼`, `${r.rounds} 把破關`, r.ending === "expose" ? "把她的手法公諸於世" : "讓她賠錢了事"];
    // 這一路：只列走到的地方
    const at = (x) => `第 ${x.match} 場・第 ${x.round} 把`;
    const steps = [];
    if (r.reach2) steps.push([at(r.reach2), "發現她其實是用右手翻骰"]);
    if (r.reach3) steps.push([at(r.reach3), "看穿她的右手，她換了招"]);
    steps.push([at({ match: r.matches, round: r.rounds }), fail ? "身上的籌碼輸光了" : "當場抓到她"]);
    // 失手：只寫不是 0 的
    const kickParts = [[wrong, "抓了她沒出千的"], [early, "抓太早"], [late, "抓太晚"]].filter(([n]) => n);
    const other = [r.halves && `慢了一步 ${r.halves} 次`, r.leaves && `中途離場 ${r.leaves} 次`, r.broke && `桌上輸光 ${r.broke} 次`, r.clears && `贏光她的籌碼 ${r.clears} 次`].filter(Boolean);
    // 2026-11-09 第三版排版：內容不變，分區塊（稱號、四格數字、時間軸、失手）
    const stat = (n, u) => el("div", {}, el("b", {}, n), el("span", {}, u));
    const sec = (t) => el("p", { class: "sec" }, el("span", {}, t));
    const o = el("div", { class: "overlay record" + (fail ? " fail" : "") }, el("div", { class: "sheet" },
      el("p", { class: "head" }, `木子的骰寶桌・${fail ? "破產紀錄" : "破關紀錄"}`),
      el("p", { class: "badge-title" }, title),
      el("div", { class: "why" }, ...why.map((t) => el("span", {}, t))),
      el("div", { class: "nums" }, stat(r.matches, "場"), stat(r.rounds, "把"), stat(min, "分鐘"), stat(`${WALLET0}→${wallet}`, "籌碼")),
      sec("這一路"),
      el("ol", { class: "path" }, ...steps.map(([when, what], n) => el("li", { class: n === steps.length - 1 ? "last" : "" }, el("small", {}, when), el("span", {}, what)))),
      sec("失手"),
      el("div", { class: "miss" },
        el("p", { class: "big" }, kickedTotal ? `被趕出去 ${kickedTotal} 次` : "一次都沒被趕出去"),
        ...kickParts.map(([n, t]) => el("p", { class: "row" }, el("span", {}, t), el("b", {}, `${n} 次`))),
        other.length ? el("p", { class: "act" }, other.join("・")) : null),
      el("div", { class: "foot" },
        el("p", {}, `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}・${r.skipped ? "跳過說明" : "看完說明"}`),
        el("p", {}, "截圖這一頁傳給開發者就好，謝謝試玩。")),
      el("button", { class: "next", onclick: () => { o.remove(); resetAll(); } }, "從頭開始")));
    document.body.append(o);
  }
  function resetAll() {
    document.querySelectorAll(".titlecard, .overlay.record").forEach((n) => n.remove());
    RUN = newRun(); saveRun();
    try { localStorage.removeItem(KEY + "layer"); localStorage.removeItem(KEY + "games"); localStorage.removeItem(KEY + "wallet"); } catch (e) {}
    gamesPlayed = 0; layer = 1; wallet = WALLET0;
    stopTells(); G.phase = "none"; startIntro(false);
  }
  async function boot() {
    const app = document.getElementById("app");
    const rb = el("button", { class: "reset", onclick: () => { if (rb.dataset.arm) { rb.dataset.arm = ""; rb.textContent = "清零重來"; resetAll(); } else { rb.dataset.arm = "1"; rb.textContent = "確定？"; setTimeout(() => { rb.dataset.arm = ""; rb.textContent = "清零重來"; }, 2500); } } }, "清零重來");
    document.body.append(rb);
    const mb = el("button", { class: "reset mute", onclick: () => { SFX.muted = !SFX.muted; try { localStorage.setItem("muzi_mute", SFX.muted ? "1" : "0"); } catch (e) {} mb.textContent = SFX.muted ? "靜音" : "有聲"; audioCtx(); } }, SFX.muted ? "靜音" : "有聲");
    document.body.append(mb);
    document.addEventListener("pointerdown", () => audioCtx(), { once: true });  // 手機要先有一次點擊才准出聲
    app.append(el("p", { class: "wait" }, "載入中……"));
    await Promise.all([...FRAMES, ...PROPS].map(load));
    loadSfx();
    sceneCv = el("canvas", { width: W, height: H });
    sceneCtx = sceneCv.getContext("2d");
    sceneWrap = el("div", { class: "scene" }, sceneCv, el("span", { class: "tag" }, ""));
    purseL = document.createElement("canvas"); purseR = document.createElement("canvas");
    S.nextBlink = performance.now() + 2500; S.nextFlick = performance.now() + 4000;
    G = fresh();
    startIntro();
    requestAnimationFrame(loop);
    ["end-reveal", "end-pay", "end-expose", "end-cloth"].forEach((n) => { const i = new Image(); i.src = IMG + n + ".webp"; });  // 結尾圖背景預載
    window.__G = () => G;
    window.__B = { record: (fail) => showRecord(fail), endCard: () => endCard(), run: () => RUN, wallet: (n) => { if (n != null) { wallet = n; saveWallet(); } return wallet; }, layer: () => layer, setLayer: (n) => { layer = n; saveLayer(); }, lost: (n) => { if (n != null) lostGames = n; return lostGames; }, intro: (i) => { startIntro(true); if (i) { G.introIdx = i; enterStep(i); } }, zoom: () => zoomLevel(performance.now()), S: () => S };
    window.__fn = { newRound, placeBet, openCup, grab, swap, swapStop, swapZones, fresh: () => { G = fresh(); }, setX: (x) => { G.swapT0 = performance.now() - x / swapZones().speed * 1000; } };
  }
  boot();
})();
</script>
