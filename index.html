      G.lines.push({ c: "line", t: G.stats.caught === 1 ? "「……我爸說你爸也抓過他一次。」" : "「夠了喔。」" });
      // 暗示她換了習慣、這幾把會比較小心（程式裡 G.real 已換、caution 3 把）
      G.lines.push({ c: "mind", t: pick(SWITCH_HINTS) });
    } else {
      await play([["hand-grab", 500]]);
      S.hold = "expr-angry"; G.diceState = "shown"; render(); synth("slap", 0.8); sfx("vAngry", 0.7);
      const loss = Math.min(G.you, a * 2);
      G.you -= loss; G.him += loss;
      G.result = `抓錯了 −${loss}`; G.rclass = "lose";
      G.stats.wrong += 1; G.angry = 3;
      G.lines.push({ c: "line", t: `你按住她的手。盅底乾乾淨淨，${sum(G.dice)} 點。` });
      G.lines.push({ c: "line", t: "「冤枉人，要付錢的。」" });
    }
    await wait(900);
    afterRound();
  }

  // 換骰：橫移命中小遊戲。畫面上主角的手伸向盅。
  function swapZones() {
    const streak = G.swapUses || 0;
    const ok = clamp(0.22 - streak * 0.05 - G.susp * 0.1, 0.08, 0.22);      // duel-sicbo 原值 0.30
    const caught = clamp(0.2 + streak * 0.03 + G.susp * 0.1, 0.2, 0.36);     // duel-sicbo 原值 0.16
    return { ok, caught, speed: 0.9 + streak * 0.35 };
  }
  function swap() {
    if (G.phase !== "open") return;
    stopTells();
    G.phase = "swap"; G.swapT0 = performance.now();
    S.hold = "hand-swap";
    render();
    const tick = () => { if (G.phase !== "swap") return; renderMarker(); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
  function markerPos() { const { speed } = swapZones(); const t = (performance.now() - G.swapT0) / 1000 * speed; const x = t % 2; return x <= 1 ? x : 2 - x; }
  function renderMarker() { const m = document.getElementById("marker"); if (m) m.style.left = `${markerPos() * 100}%`; }
  async function swapStop() {
    if (G.phase !== "swap") return;
    const x = markerPos(); const { ok, caught } = swapZones(); const a = G.bet.amt;
    G.swapFrozen = { ok, caught };  // 凍結畫面用按下那一刻的區域；次數加一後區域會縮，不能重算
    G.swapUses = (G.swapUses || 0) + 1;
    G.phase = "swapfreeze"; G.swapX = x;
    G.swapZone = Math.abs(x - 0.5) <= ok / 2 ? "ok" : (x < caught || x > 1 - caught) ? "caught" : "fail";
    render();
    await wait(900);
    G.act = "換骰"; G.phase = "reveal"; render();
    if (G.swapZone === "ok") {
      const before = G.dice.slice(); flipToward(G.bet.side); const after = G.dice.slice();
      G.stats.swapOk += 1; G.susp = clamp(G.susp + 0.12, 0, 1);
      const herFlip = G.cheated && G.orig;  // 她也出千：一樣看得出來
      G.dice = herFlip ? G.orig.slice() : before;  // 先開出原本的點數
      S.hold = null; G.diceState = "shown"; render(); sfx("diceShow", 0.6);  // 盅一抬起就亮出原本的點數
      await play([["cup-open", 500]]);
      await wait(300);  // 原本的點數亮 0.8 秒再翻
      if (herFlip) {
        G.dice = before; G.noticed = true; G.cheatFlipAt = performance.now();  // 先翻她的
        G.lines.push({ c: "mind", t: caughtLine(G.dice) });
        render(); sfx("diceShow", 0.35);
        await wait(800);
      }
      G.dice = after; G.flipped = [0, 1, 2].filter((i) => before[i] !== after[i]); G.flipAt = performance.now();  // 再翻成撥過的
      G.lines.push({ c: "line", t: G.flipped.length > 1 ? "掀盅的瞬間，你用小指撥了兩顆。" : "掀盅的瞬間，你用小指撥了一顆。" });
      render(); sfx("diceShow", 0.35);
      settle(true, a);
      G.lines.push({ c: "line", t: G.cheated ? "她盯著骰子看了很久，什麼都沒說。" : "「……」她皺了一下眉。" });
      await wait(600);
      afterRound();
    } else if (G.swapZone === "caught") {
      S.hold = "hand-swap-caught"; render(); synth("slap", 0.9); sfx("swapCaught", 0.6); sfx("vAngry", 0.7);
      const loss = Math.min(G.you, a * 3);
      G.you -= loss; G.him += loss;
      G.result = `被抓 −${loss}`; G.rclass = "lose";
      G.stats.swapBad += 1; G.susp = clamp(G.susp + 0.35, 0, 1);
      G.lines.push({ c: "line", t: "你的小指剛碰到骰子，手腕就被扣住了。" });
      G.lines.push({ c: "line", t: "「在我這裡玩這個？」她從你那堆籌碼裡拿走三倍。" });
      await wait(1200);
      afterRound();
    } else {
      G.susp = clamp(G.susp + 0.05, 0, 1);
      G.lines.push({ c: "line", t: "手指滑了一下，沒碰到骰子。只能照開。" });
      S.hold = null; G.phase = "open"; await openCup();
    }
  }

  // ---------- 畫面 ----------
  let sceneWrap, purseL, purseR;
  function render() {
    const app = document.getElementById("app");
    app.innerHTML = "";
    // 順序：籌碼｜場景｜籌碼、骰子列、對話框、操作區（2026-11-08：場景縮小，籌碼改放場景兩側）
    sceneWrap.querySelector(".tag").textContent = G.phase === "intro" ? "" : `第 ${G.round} 把` + (G.bet ? `　押${sideName[G.bet.side]} ${G.bet.amt} 個` : "");
    app.append(renderRow());
    sceneWrap.classList.toggle("hl", !!(G.phase === "intro" && G.demo && G.demo.hl.scene));
    // 押完到開盅之前（抉擇階段），外框一閃一閃：提示這段時間她可能露出破綻。說明那頁也用同一個
    sceneWrap.classList.toggle("watch", G.phase === "open" || !!(G.phase === "intro" && G.demo && G.demo.scene === "watch"));
    const lower = el("div", { class: "lower" }, renderDice(), renderTalk(), renderPanel());
    if (G.phase === "intro" && fullIntro()) lower.addEventListener("click", nextIntro);  // 說明時點下半部任何地方都是下一步
    if (G.phase === "swap" || G.phase === "swapfreeze") lower.append(renderSwapBox());  // 換骰：另一個框蓋住下面所有區域
    app.append(lower);
    if (G.phase === "end") app.append(el("div", { class: "overlay" }, renderEnd()));  // 結算：全螢幕蓋住
  }

  function renderTalk() {
    const lines = el("div", { class: "lines" });
    G.lines.slice(-3).forEach((l) => lines.append(el("p", { class: l.c }, l.t)));
    if (G.note && (G.phase === "result" || G.phase === "endwait")) lines.append(el("p", { class: "act" }, G.note));
    const tab = G.phase === "intro" && fullIntro() && G.introIdx < INTRO.length - 1
      ? el("button", { class: "nexttab", onclick: (e) => { e.stopPropagation(); nextIntro(); } }, `${G.introIdx + 1} / ${INTRO.length}　下一步 ▶`) : null;
    const who = G.phase === "intro" && G.lines[0] && G.lines[0].c === "act" ? "旁白" : "木子";
    return el("div", { class: "talk" }, el("span", { class: "who" }, who), tab, lines);  // 固定高度，新句子從底下疊上來，舊的被推出去
  }

  const PURSE_CAP = 20;  // 籌碼窗固定畫 20 個的高度；超過就不再長高，畫面不跳。數字照實
  function purse(canvas, color, n) {
    const scale = 40 / img["chip-top-" + color].width;
    const h = Math.ceil(stackHeight(color, PURSE_CAP, scale)) + 2;
    canvas.width = 40; canvas.height = h; canvas.style.height = h + "px";
    const c = canvas.getContext("2d"); c.clearRect(0, 0, 40, h);
    if (n > 0) drawStack(c, color, Math.min(n, PURSE_CAP), 20, h - 1, scale);
  }
  function renderRow() {
    const pv = S.purseHold || G;
    purse(purseL, "black", pv.him); purse(purseR, "red", pv.you);
    const hlPurse = G.phase === "intro" && G.demo && G.demo.hl.purse;
    // 三欄：她的籌碼｜場景（縮小）｜你的籌碼；骰子列、對話框在下面整排
    return el("div", { class: "row" },
      el("div", { class: "purse" + (hlPurse ? " hl" : "") }, el("span", { class: "who" }, "木子"), purseL, el("span", { class: "n" }, String(pv.him))),
      sceneWrap,
      el("div", { class: "purse me" + (hlPurse ? " hl" : "") }, el("span", { class: "who" }, "你"), purseR, el("span", { class: "n" }, String(pv.you))));
  }
  function renderDice() {
    if (G.phase === "intro" && G.demo && G.demo.dice) return renderDemoDice();
    const dice = el("div", { class: "dice" });
    for (let i = 0; i < 3; i++) {
      const shown = G.diceState === "shown";
      const hp = G.diceState === "heard" && G.heard ? G.heard.find((h) => h.i === i) : null;
      const heard = !!hp;
      const v = shown ? G.dice[i] : hp ? hp.v : null;
      const flipped = shown && (G.flipped || []).includes(i);
      const cheatMarked = shown && G.noticed && G.changed === i && !flipped;
      const flipAge = flipped && G.flipAt ? performance.now() - G.flipAt : cheatMarked && G.cheatFlipAt ? performance.now() - G.cheatFlipAt : Infinity;
      const anim = (flipped || cheatMarked) && flipAge < 280;
      const cls = "die" + (shown ? " shown" : heard ? " heard" : "") + (G.phase === "shake" ? " shake" : "") + (shown && G.noticed && G.changed === i ? " cheatmark" : "") + (flipped ? " flipped" : "") + (anim ? " flipanim" : "");
      const d = el("div", { class: cls });
      if (v) d.append(el("img", { src: `${IMG}die-${v}.webp`, alt: String(v), style: anim ? `animation-delay:-${Math.round(flipAge)}ms` : null }));
      dice.append(d);
    }
    return dice;
  }

  function renderPanel() {
    const p = el("div", { class: "panel" });
    if (G.phase === "intro") {
      const last = fullIntro() ? G.introIdx >= INTRO.length - 1 : true;
      if (last) p.append(el("button", { class: "next", onclick: () => { stopTells(); G.demo = null; newRound(); } }, "坐下"));
      else renderDemoPanel(p);
    } else if (G.phase === "shake") {
      p.append(el("p", { class: "wait" }, "她在搖盅……"));
    } else if (G.phase === "bet") {
      const amt = el("div", { class: "amt" });
      for (let n = 1; n <= 3; n++) amt.append(el("button", { class: G.amt === n ? "on" : "", disabled: n > maxAmt(), onclick: () => { G.amt = n; render(); } }, G.amt === n ? `押 ${n} 個` : `${n} 個`));
      p.append(amt);
      p.append(el("div", { class: "bs" },
        el("button", { onclick: () => placeBet("small") }, el("b", {}, "小"), el("small", {}, "4–10")),
        el("button", { onclick: () => placeBet("big") }, el("b", {}, "大"), el("small", {}, "11–17"))));
    } else if (G.phase === "open") {
      p.append(el("div", { class: "moves" },
        el("button", { class: "mv open", onclick: openCup }, el("b", {}, "正常開")),
        el("button", { class: "mv grab", onclick: grab }, el("b", {}, "抓對手出千")),
        el("button", { class: "mv swap", onclick: swap }, el("b", {}, "自己出千"))));
    } else if (G.phase === "swap" || G.phase === "swapfreeze") {
      p.append(el("p", { class: "wait" }, "……"));  // 被換骰框蓋住
    } else if (G.phase === "reveal") {
      p.append(el("p", { class: "wait" }, "……"));
    } else if (G.phase === "result" || G.phase === "endwait") {
      const sd = sideOf(G.dice);
      p.append(el("div", { class: "card " + G.rclass },
        el("span", { class: "sum" }, `${sum(G.dice)} 點`),
        el("span", { class: "bs2" }, sd === "triple" ? `豹子　你押${sideName[G.bet.side]}` : `${sideName[sd]}　你押${sideName[G.bet.side]}`),
        el("span", { class: "net" }, G.result || "")));
      if (G.phase === "result") {
        p.append(el("button", { class: "next", onclick: newRound }, "下一把"));
      }
      else p.append(el("button", { class: "next", onclick: () => { G.phase = "end"; render(); } }, G.you <= 0 ? "籌碼沒了" : "她的籌碼沒了"));
    }
    return p;
  }
  function renderSwapBox() {
    const p = el("div", { class: "swapbox" });
    {
      const frozen = G.phase === "swapfreeze"; const { ok, caught } = frozen ? G.swapFrozen : swapZones();
      const bar = el("div", { class: "bar" },
        el("div", { class: "z caught", style: `left:0;width:${caught * 100}%` }),
        el("div", { class: "z fail", style: `left:${caught * 100}%;width:${(0.5 - ok / 2 - caught) * 100}%` }),
        el("div", { class: "z ok", style: `left:${(0.5 - ok / 2) * 100}%;width:${ok * 100}%` }),
        el("div", { class: "z fail", style: `left:${(0.5 + ok / 2) * 100}%;width:${(0.5 - ok / 2 - caught) * 100}%` }),
        el("div", { class: "z caught", style: `right:0;width:${caught * 100}%` }),
        el("div", { id: "marker", class: "marker" + (frozen ? " frozen" : ""), style: frozen ? `left:${G.swapX * 100}%` : "" }));
      const n = G.swapUses + (frozen ? 0 : 1);
      const watch = n <= 1 ? "她在看別桌。" : n === 2 ? "她的眼角瞄著你的手。" : n === 3 ? "她往前傾，盯著盅。" : n === 4 ? "她的手已經放在盅邊。" : "她沒在看骰子了，她只看你。";
      p.append(el("p", { class: "title" }, "自己出千"));
      p.append(el("p", { class: "watch" }, watch));
      p.append(bar);
      p.append(el("span", { class: "label", style: "text-align:center" }, "綠：換成功　黃：沒換到，照開　紅：被抓"));
      if (frozen) p.append(el("p", { class: "zone " + G.swapZone }, { ok: "成功", fail: "沒換到", caught: "被發現" }[G.swapZone]));
      else p.append(el("button", { class: "next stop", onclick: swapStop }, "動手"));
    }
    return p;
  }

  function thumb(tell) {
    const [x, y, w, h] = TELL_CROP[tell];
    const c = document.createElement("canvas"); c.width = 88; c.height = 88;
    const src = img[`tell-${tell}-b`]; const k = Math.max(88 / w, 88 / h);
    c.getContext("2d").drawImage(src, x, y, w, h, (88 - w * k) / 2, (88 - h * k) / 2, w * k, h * k);
    c.title = TELL_NAME[tell];
    return c;
  }
  function renderLog() {
    const t = el("table", { class: "log" }, el("thead", {}, el("tr", {}, ["把", "押", "她的動作", "你", "結果", "她"].map((h) => el("th", {}, h)))));
    const tb = el("tbody");
    for (const r of G.log) tb.append(el("tr", { class: r.cheated ? "cheat" : "" },
      el("td", {}, r.n), el("td", {}, r.bet),
      el("td", {}, r.tells.length ? el("div", { class: "thumbs" }, r.tells.map(thumb)) : "—"),
      el("td", {}, r.act), el("td", { class: r.res && r.res.includes("+") ? "w" : "l" }, r.res || ""), el("td", {}, r.noticed ? "出千" : r.cheated ? "出千（你沒發現）" : "")));
    t.append(tb);
    return el("div", { class: "logwrap" }, t);
  }
  const HINT = "出千的那幾把，總有一個動作特別常出現。她下一局還是這個習慣，除非你抓到她。";
  function renderEnd() {
    const won = G.him <= 0; const s = G.stats;
    return el("div", { class: "sheet" },
      el("h2", {}, won ? "她的籌碼沒了" : "你的籌碼沒了"),
      el("p", {}, won ? "她把空盅推給你：「明天再來。」" : "她把籌碼收進抽屜：「慢走。」"),
      // 提示：輸光才給，按了才出現那句話（放在紀錄表這頁，對著表看）
      won ? null : G.hintShown ? el("p", { class: "tell" }, HINT) : el("button", { class: "hint", onclick: () => { G.hintShown = true; render(); } }, "提示"),
      el("div", { class: "stats" },
        el("span", {}, "總共開了"), el("b", {}, `${G.round} 把`),
        el("span", {}, "她出千"), el("b", {}, `${s.cheats} 次`),
        el("span", {}, "你抓到"), el("b", {}, `${s.caught} 次`),
        el("span", {}, "你抓錯"), el("b", {}, `${s.wrong} 次`),
        el("span", {}, "你換骰"), el("b", {}, `成功 ${s.swapOk}，失手 ${s.swapBad}`),
        ),
      el("button", { class: "next", onclick: () => { G = fresh(); newRound(); } }, "再賭一局"),
      el("button", { class: "hint", onclick: () => startIntro(true) }, "從說明開始"),
      el("details", { class: "logbox", open: true },
        el("summary", {}, "每把紀錄"),
        renderLog()));
  }

  // ---------- 啟動 ----------
  function resetAll() {
    try { localStorage.removeItem("muzi_tell"); localStorage.removeItem("muzi_games"); } catch (e) {}
    gamesPlayed = 0; realTell = pick(TELLS);
    stopTells(); G.phase = "none"; startIntro(false);
  }
  async function boot() {
    const app = document.getElementById("app");
    const rb = el("button", { class: "reset", onclick: () => { if (rb.dataset.arm) { rb.dataset.arm = ""; rb.textContent = "清零重來"; resetAll(); } else { rb.dataset.arm = "1"; rb.textContent = "確定？"; setTimeout(() => { rb.dataset.arm = ""; rb.textContent = "清零重來"; }, 2500); } } }, "清零重來");
    document.body.append(rb);
    const mb = el("button", { class: "reset mute", onclick: () => { SFX.muted = !SFX.muted; try { localStorage.setItem("muzi_mute", SFX.muted ? "1" : "0"); } catch (e) {} mb.textContent = SFX.muted ? "靜音" : "有聲"; audioCtx(); } }, SFX.muted ? "靜音" : "有聲");
    document.body.append(mb);
    document.addEventListener("pointerdown", () => audioCtx(), { once: true });  // 手機要先有一次點擊才准出聲
    app.append(el("p", { class: "wait" }, "載入中……"));
    await Promise.all([...FRAMES, ...PROPS].map(load));
    loadSfx();
    sceneCv = el("canvas", { width: W, height: H });
    sceneCtx = sceneCv.getContext("2d");
    sceneWrap = el("div", { class: "scene" }, sceneCv, el("span", { class: "tag" }, ""));
    purseL = document.createElement("canvas"); purseR = document.createElement("canvas");
    S.nextBlink = performance.now() + 2500; S.nextFlick = performance.now() + 4000;
    G = fresh();
    startIntro();
    requestAnimationFrame(loop);
    window.__G = () => G;
    window.__fn = { newRound, placeBet, openCup, grab, swap, swapStop, swapZones, fresh: () => { G = fresh(); }, setX: (x) => { G.swapT0 = performance.now() - x / swapZones().speed * 1000; } };
  }
  boot();
})();
</script>
</html>
